<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zockhaus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: schlanke Kopfzeile mit Suche, darunter Kategorie-Chips und ein Kachelraster
   (2 Spalten am Handy, 4 am Rechner, erste Kachel doppelt breit).
   Jedes Spiel öffnet als Vollbild-Ansicht über #spielname. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#13201e; --muted:#586966; --line:#d3dcd9;
  --accent:#e8472a; --accent-ink:#ffffff; --focus:#1d6fe0;
  --cell:#cfd9d6; --cell-open:#f8fbfa; --x:#e8472a; --o:#1f7fc4;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101616; --surface:#192222; --ink:#e8f0ee; --muted:#93a5a1; --line:#2a3836;
    --accent:#ff7a59; --accent-ink:#1a0c08; --focus:#6aa7ff;
    --cell:#33423f; --cell-open:#1a2423; --x:#ff7a59; --o:#5db4f0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101616; --surface:#192222; --ink:#e8f0ee; --muted:#93a5a1; --line:#2a3836;
  --accent:#ff7a59; --accent-ink:#1a0c08; --focus:#6aa7ff;
  --cell:#33423f; --cell-open:#1a2423; --x:#ff7a59; --o:#5db4f0; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
body.noscroll{overflow:hidden}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}

.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.75rem;letter-spacing:-.02em}
.brand svg{width:36px;height:36px;flex:none}
.brand .bg{fill:var(--accent)}
.brand .fg{fill:var(--accent-ink)}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search input{width:100%;min-height:44px;padding:0 14px 0 42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}

.intro h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,6vw,3rem);letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.intro p{margin-top:8px;color:var(--muted);max-width:52ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 18px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:880px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.tile{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .18s ease,border-color .18s ease}
.tile:hover{transform:translateY(-3px);border-color:var(--ink)}
.tile.feat{grid-column:span 2}
.thumb{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden}
.tile.feat .thumb{aspect-ratio:2/1}
@media (min-width:880px){.tile.feat .thumb{aspect-ratio:auto;flex:1 1 auto;min-height:0}}
.thumb svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .35s ease}
.tile:hover .thumb svg{transform:scale(1.06)}
.tbody{display:flex;flex-direction:column;gap:5px;padding:12px 14px 14px;min-width:0}
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tbody h3{font-family:var(--font-display);font-weight:700;font-size:1.12rem;letter-spacing:-.01em}
.tag{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbody p{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec{font-family:var(--font-mono);font-size:.74rem;color:var(--ink);margin-top:2px}
.rec.none{color:var(--muted)}
.empty{grid-column:1/-1;padding:40px 0;color:var(--muted);text-align:center}
.foot{margin-top:32px;color:var(--muted);font-size:.85rem}

/* Spielansicht */
.game{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 14px;padding-block:14px}
.gbar h2{font-family:var(--font-display);font-weight:800;font-size:1.4rem;letter-spacing:-.02em;outline:none;min-width:0}
.stats{display:flex;gap:8px}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:64px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stat span{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--font-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){.gbar{grid-template-columns:1fr auto}.gbar h2{grid-column:1/-1;order:3}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:8px;min-width:0}
.gfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:14px 18px;color:var(--muted);font-size:.9rem}
.gfoot p{flex:1 1 260px;max-width:60ch}

.board-wrap{position:relative;max-width:100%;touch-action:none}
.cv{display:block;border-radius:14px;max-width:100%}
.overlay{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:rgba(8,14,13,.78);color:#fff;z-index:2}
.ov-title{font-family:var(--font-display);font-weight:800;font-size:2rem;letter-spacing:-.02em}
.ov-sub{opacity:.85;margin-bottom:6px;max-width:30ch}
.info{font-family:var(--font-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.pad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center}
@media (pointer:coarse){.pad{display:grid}}
.pad .btn{padding:0;min-height:0;font-size:1.3rem}
.pad .up{grid-column:2}
.pad .lf{grid-column:1;grid-row:2}
.pad .dn{grid-column:2;grid-row:2}
.pad .rt{grid-column:3;grid-row:2}

/* Memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(calc(100vw - 32px),420px,calc(100vh - 300px))}
.mem-card{position:relative;aspect-ratio:1;border:0;border-radius:14px;padding:0;cursor:pointer;background:var(--accent);transition:transform .15s ease}
.mem-card:hover{transform:scale(1.04)}
.mem-card .front{display:none;position:absolute;inset:0;border-radius:14px;background:var(--surface);border:2px solid var(--line);place-items:center}
.mem-card.open .front{display:grid}
.mem-card.open{background:transparent}
.mem-card.done{opacity:.5;cursor:default;transform:none}
.mem-card svg{width:56%;height:56%}

/* 2048 */
.b2048{container-type:inline-size;display:grid;grid-template-columns:repeat(4,1fr);gap:2.4cqw;padding:2.4cqw;border-radius:14px;background:#1d2a28;width:min(calc(100vw - 32px),420px,calc(100vh - 290px));touch-action:none}
.b2048 .t{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;background:#2a3a37}
.b2048 .t.pop{animation:pop .18s ease}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}

/* Blitzreaktion */
.blitz{width:min(calc(100vw - 32px),460px);min-height:min(46vh,320px);border:0;border-radius:20px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.blitz strong{font-family:var(--font-display);font-weight:800;font-size:2.6rem;letter-spacing:-.02em}
.blitz span{opacity:.9}
.blitz[data-s="idle"],.blitz[data-s="done"]{background:#2166c4}
.blitz[data-s="wait"]{background:#c9342f}
.blitz[data-s="go"]{background:#1f9e55}
.blitz[data-s="early"]{background:#c2701c}
.blitz-list{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:34px}
.blitz-list b{font-family:var(--font-mono);font-weight:500;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

/* Minenfeld */
.mines{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:min(calc(100vw - 32px),420px,calc(100vh - 320px));touch-action:manipulation}
.mc{aspect-ratio:1;border:0;border-radius:6px;padding:0;display:grid;place-items:center;background:var(--cell);font-family:var(--font-mono);font-weight:500;font-size:clamp(.9rem,4.4vw,1.35rem);cursor:pointer;user-select:none;-webkit-user-select:none}
.mc.open{background:var(--cell-open);cursor:default}
.mc.boom{background:#e04848}
.mc svg{width:62%;height:62%}
.mc[data-n="1"]{color:#2b6fd6}.mc[data-n="2"]{color:#2f9e55}.mc[data-n="3"]{color:#e04848}.mc[data-n="4"]{color:#8a5be0}
.mc[data-n="5"]{color:#c9741f}.mc[data-n="6"]{color:#139a9d}.mc[data-n="7"]{color:var(--ink)}.mc[data-n="8"]{color:var(--muted)}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Drei gewinnt */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(calc(100vw - 32px),340px,calc(100vh - 340px))}
.tc{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,14vw,4rem);line-height:1;padding:0}
.tc[data-v="X"]{color:var(--x)}.tc[data-v="O"]{color:var(--o)}
.tc.win{border-color:var(--ink);background:var(--cell)}
.tc:disabled{cursor:default}
.seg{display:flex;gap:8px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="portal">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 36 36" aria-hidden="true"><rect class="bg" width="36" height="36" rx="10"/><path class="fg" d="M13 9.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 13 9.5z"/></svg>
      Zockhaus
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Spiel suchen" autocomplete="off" aria-label="Spiel suchen">
    </label>
  </header>

  <section class="intro">
    <h1>Sofort spielen</h1>
    <p><span id="count">7</span> Spiele direkt im Browser, am Handy und am Rechner. Ohne Download, ohne Anmeldung.</p>
  </section>

  <div class="chips" id="chips" role="group" aria-label="Kategorie"></div>
  <main class="grid" id="grid"></main>
  <p class="foot">Deine Rekorde bleiben in diesem Browser gespeichert.</p>
</div>

<section class="game" id="game" hidden aria-label="Spielansicht">
  <div class="gbar">
    <a class="btn back" href="#">&larr; Alle Spiele</a>
    <h2 id="gtitle" tabindex="-1"></h2>
    <div class="stats">
      <div class="stat"><span id="klabel">Punkte</span><b id="sc">0</b></div>
      <div class="stat"><span>Rekord</span><b id="bs">–</b></div>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="gfoot">
    <p id="ghint"></p>
    <button class="btn" id="restart" type="button">Neustart</button>
  </div>
</section>

<script>
(function(){
'use strict';

/* ---------- Hilfsfunktionen ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rnd = n => Math.floor(Math.random() * n);
const mem = {};
const store = {
  get(k, d){ try { const v = localStorage.getItem('zockhaus:' + k); if (v !== null) return JSON.parse(v); } catch(e){} return (k in mem) ? mem[k] : d; },
  set(k, v){ mem[k] = v; try { localStorage.setItem('zockhaus:' + k, JSON.stringify(v)); } catch(e){} }
};
function overlay(wrap){
  const o = el('div', 'overlay'); o.hidden = true;
  const t = el('div', 'ov-title'), s = el('div', 'ov-sub'), b = el('button', 'btn primary'); b.type = 'button';
  o.append(t, s, b); wrap.append(o);
  let cb = null;
  b.addEventListener('click', () => { o.hidden = true; if (cb) cb(); });
  return {
    show(title, sub, btn, fn){ t.textContent = title; s.textContent = sub || ''; b.textContent = btn || ''; b.hidden = !btn; cb = fn; o.hidden = false; if (btn) b.focus(); },
    hide(){ o.hidden = true; }
  };
}
function sizeFor(stage, maxW, reserve){
  return Math.floor(Math.max(240, Math.min(stage.clientWidth || 360, innerHeight - reserve, maxW)));
}

/* ---------- Snake ---------- */
function snake(stage, api){
  const N = 18, dpr = Math.min(devicePixelRatio || 1, 2);
  const size = Math.max(252, Math.floor(sizeFor(stage, 440, 300) / N) * N), c = size / N;
  const wrap = el('div', 'board-wrap'), cv = el('canvas', 'cv');
  cv.width = cv.height = size * dpr; cv.style.width = cv.style.height = size + 'px';
  wrap.append(cv); stage.append(wrap);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const ov = overlay(wrap);
  const pad = el('div', 'pad');
  [['up','↑',0,-1],['lf','←',-1,0],['dn','↓',0,1],['rt','→',1,0]].forEach(([k, t, x, y]) => {
    const b = el('button', 'btn ' + k, t); b.type = 'button'; b.setAttribute('aria-label', 'Richtung ' + t);
    b.addEventListener('pointerdown', e => { e.preventDefault(); turn(x, y); });
    pad.append(b);
  });
  stage.append(pad);

  let body, dir, nd, food, score, alive, running, timer;
  function reset(){
    body = [{x:8,y:9},{x:7,y:9},{x:6,y:9}]; dir = {x:1,y:0}; nd = dir; score = 0; alive = true; running = false;
    placeFood(); api.set(0); draw();
  }
  function placeFood(){
    let p; do { p = {x:rnd(N), y:rnd(N)}; } while (body.some(s => s.x === p.x && s.y === p.y));
    food = p;
  }
  function start(){ if (running || !alive) return; running = true; ov.hide(); loop(); }
  function loop(){ timer = setTimeout(() => { step(); if (alive && running) loop(); }, Math.max(65, 150 - score * 3)); }
  function step(){
    dir = nd;
    const h = {x: body[0].x + dir.x, y: body[0].y + dir.y};
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(s => s.x === h.x && s.y === h.y)) { die(); return; }
    body.unshift(h);
    if (h.x === food.x && h.y === food.y) { score++; api.set(score); placeFood(); } else body.pop();
    draw();
  }
  function die(){
    alive = false; running = false; api.finish(score); draw();
    ov.show('Game over', score + ' Punkte', 'Nochmal', () => { reset(); start(); });
  }
  function turn(x, y){
    if (!alive) return;
    if (x === -dir.x && y === -dir.y) return;
    nd = {x, y}; start();
  }
  function draw(){
    ctx.fillStyle = '#0f1f1b'; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#132721';
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if ((i + j) % 2) ctx.fillRect(i * c, j * c, c, c);
    ctx.fillStyle = '#ff5a5f'; ctx.beginPath(); ctx.arc((food.x + .5) * c, (food.y + .5) * c, c * .34, 0, 7); ctx.fill();
    ctx.fillStyle = '#4fe3a3'; ctx.fillRect((food.x + .5) * c - 1, food.y * c + c * .08, 2, c * .2);
    body.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#9dffd2' : '#3be09a';
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath(); ctx.roundRect(s.x * c + pad, s.y * c + pad, c - pad * 2, c - pad * 2, c * .28); ctx.fill();
    });
    const h = body[0], ex = dir.y !== 0 ? [.3, .7] : [.62, .62], ey = dir.y !== 0 ? [.6, .6] : [.3, .7];
    ctx.fillStyle = '#0f1f1b';
    for (let k = 0; k < 2; k++) { ctx.beginPath(); ctx.arc((h.x + ex[k]) * c, (h.y + ey[k]) * c, c * .08, 0, 7); ctx.fill(); }
  }
  const keys = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
  function onKey(e){ const k = keys[e.key]; if (!k) return; e.preventDefault(); turn(k[0], k[1]); }
  addEventListener('keydown', onKey);
  let tx = 0, ty = 0;
  wrap.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  wrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  }, {passive:true});
  function intro(){ ov.show('Snake', 'Pfeiltasten, WASD oder wischen', 'Los', start); }
  api.onRestart(() => { clearTimeout(timer); reset(); intro(); });
  reset(); intro();
  return () => { clearTimeout(timer); removeEventListener('keydown', onKey); };
}

/* ---------- Memory ---------- */
function memory(stage, api){
  const shapes = [
    '<circle cx="12" cy="12" r="9"/>',
    '<rect x="3" y="3" width="18" height="18" rx="3"/>',
    '<polygon points="12,3 22,21 2,21"/>',
    '<polygon points="12,2 22,12 12,22 2,12"/>',
    '<polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6"/>',
    '<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',
    '<polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/>',
    '<polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"/>'
  ];
  const cols = ['#e5446d','#f0a30a','#12a974','#1f7fc4','#8a4be0','#e8662a','#2aa7a0','#c23b9a'];

/* ---------- 2048 ---------- */
function g2048(stage, api){
  const wrap = el('div', 'board-wrap'), board = el('div', 'b2048');
  wrap.append(board); stage.append(wrap);
  const ov = overlay(wrap);
  const ramp = {2:['#d7e8e2','#17302b'],4:['#bfe0d4','#17302b'],8:['#8fd1b6','#0f2a22'],16:['#5cc29a','#062018'],32:['#2fae86','#ffffff'],
    64:['#f2b84b','#2a1b00'],128:['#f59a3c','#2a1500'],256:['#f27a3b','#ffffff'],512:['#e9553d','#ffffff'],1024:['#c93a5a','#ffffff'],2048:['#8a2b86','#ffffff']};
  let g, score, won, over, fresh;
  function empties(){ const e = []; g.forEach((v, i) => { if (!v) e.push(i); }); return e; }
  function add(){ const e = empties(); if (!e.length) return; fresh = e[rnd(e.length)]; g[fresh] = Math.random() < .9 ? 2 : 4; }
  function reset(){ g = Array(16).fill(0); score = 0; won = false; over = false; fresh = -1; add(); add(); api.set(0); ov.hide(); render(); }
  function render(){
    board.innerHTML = '';

      const t = el('div', 't' + (i === fresh ? ' pop' : ''), v ? String(v) : '');
      if (v) {
        const c = ramp[v] || ['#2a1840', '#ffffff'];
        t.style.background = c[0]; t.style.color = c[1];

      }
      board.append(t);
    });
  }
  function slide(r){
    const a = r.filter(Boolean), out = []; let gain = 0;
    for (let i = 0; i < a.length; i++) {
      if (a[i] === a[i + 1]) { out.push(a[i] * 2); gain += a[i] * 2; i++; } else out.push(a[i]);

  }

    if (over) return;

      const idx = [0,1,2,3].map(j => d === 0 ? k * 4 + j : d === 2 ? k * 4 + 3 - j : d === 1 ? j * 4 + k : (3 - j) * 4 + k);

  }

    if (empties().length) return true;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const v = g[r * 4 + c];
      if (c < 3 && v === g[r * 4 + c + 1]) return true;
      if (r < 3 && v === g[(r + 1) * 4 + c]) return true;
    }

  }

  function onKey(e){ if (!(e.key in keys)) return; e.preventDefault(); move(keys[e.key]); }

  board.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;

  return () => removeEventListener('keydown', onKey);
}

/* ---------- Luftsprung ---------- */
function luft(stage, api){
  const W = 320, H = 480, S = 2;
  const cssW = Math.max(220, Math.floor(Math.min(stage.clientWidth || 340, (innerHeight - 250) * W / H, 400)));
  const wrap = el('div', 'board-wrap'), cv = el('canvas', 'cv');
  cv.width = W * S; cv.height = H * S; cv.style.width = cssW + 'px'; cv.style.height = Math.round(cssW * H / W) + 'px';
  wrap.append(cv); stage.append(wrap);
  const ctx = cv.getContext('2d'); ctx.scale(S, S);
  const ov = overlay(wrap);
  const GROUND = 28, GAP = 142, PW = 52, BX = 90, R = 13;
  let by, vy, pipes, score, mode, last, raf, clouds, t = 0, dead = false;
  function reset(){
    by = H / 2; vy = 0; pipes = []; score = 0; mode = 'ready'; api.set(0); ov.hide();
    clouds = [{x:40,y:90,w:34},{x:210,y:150,w:28},{x:130,y:250,w:38}];
  }
  function flap(){
    if (mode === 'dead') return;
    if (mode === 'ready') mode = 'play';
    vy = -400;
  }
  function die(){
    mode = 'dead'; api.finish(score);
    setTimeout(() => { if (!dead) ov.show('Aua', score + ' Punkte', 'Nochmal', reset); }, 500);
  }
  function update(dt){
    t += dt;
    clouds.forEach(c => { c.x -= 10 * dt; if (c.x < -60) c.x = W + 60; });
    if (mode === 'ready') { by = H / 2 + Math.sin(t * 4) * 6; return; }
    vy += 1500 * dt; by += vy * dt;
    if (by < R) { by = R; vy = 0; }
    if (by + R >= H - GROUND) { by = H - GROUND - R; if (mode === 'play') die(); vy = 0; }
    if (mode !== 'play') return;
    pipes.forEach(p => p.x -= 128 * dt);
    if (!pipes.length || pipes[pipes.length - 1].x < W - 190) pipes.push({x: W + 20, gy: 100 + rnd(H - GROUND - 200), passed: false});
    pipes = pipes.filter(p => p.x > -PW - 10);
    for (const p of pipes) {
      if (!p.passed && p.x + PW < BX - R) { p.passed = true; score++; api.set(score); }
      if (BX + R > p.x && BX - R < p.x + PW && (by - R < p.gy - GAP / 2 || by + R > p.gy + GAP / 2)) { die(); break; }
    }
  }
  function draw(){
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#7cc8f2'); g.addColorStop(1, '#e2f5ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    clouds.forEach(c => {
      ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w, c.w * .35, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.x + c.w * .5, c.y + 4, c.w * .7, c.w * .28, 0, 0, 7); ctx.fill();
    });
    pipes.forEach(p => {
      const top = p.gy - GAP / 2, bot = p.gy + GAP / 2;
      ctx.fillStyle = '#2f9e6f'; ctx.fillRect(p.x, 0, PW, top); ctx.fillRect(p.x, bot, PW, H - GROUND - bot);
      ctx.fillStyle = '#1f7a53'; ctx.fillRect(p.x - 4, top - 16, PW + 8, 16); ctx.fillRect(p.x - 4, bot, PW + 8, 16);
    });
    ctx.fillStyle = '#d9b26f'; ctx.fillRect(0, H - GROUND, W, GROUND);
    ctx.fillStyle = '#8fbf4a'; ctx.fillRect(0, H - GROUND, W, 6);
    ctx.save(); ctx.translate(BX, by); ctx.rotate(Math.max(-.5, Math.min(.9, vy / 600)));
    ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffb066'; ctx.beginPath(); ctx.arc(-2, 5, R * .6, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(R - 2, 0); ctx.lineTo(R + 8, 3); ctx.lineTo(R - 2, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -4, 4.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(6.5, -4, 2, 0, 7); ctx.fill();
    ctx.restore();
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.font = '800 44px "Bricolage Grotesque", system-ui, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = '#0b3b2b'; ctx.fillStyle = '#fff';
    ctx.strokeText(String(score), W / 2, 74); ctx.fillText(String(score), W / 2, 74);
    if (mode === 'ready') {
      ctx.font = '700 20px "DM Sans", system-ui, sans-serif'; ctx.lineWidth = 5;
      ctx.strokeText('Tippen zum Flattern', W / 2, H / 2 + 70); ctx.fillText('Tippen zum Flattern', W / 2, H / 2 + 70);
    }
  }
  function frame(ts){
    const dt = Math.min(.033, last ? (ts - last) / 1000 : .016); last = ts;
    update(dt); draw(); raf = requestAnimationFrame(frame);
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  function onKey(e){ if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); flap(); } }
  addEventListener('keydown', onKey);
  api.onRestart(reset);
  reset(); raf = requestAnimationFrame(frame);
  return () => { dead = true; cancelAnimationFrame(raf); removeEventListener('keydown', onKey); };
}

/* ---------- Blitzreaktion ---------- */

    if (state === 'idle' || state === 'done' || state === 'early') {

  api.set('–'); idle();

}

/* ---------- Minenfeld ---------- */
function minefield(stage, api){
  const R = 9, C = 9, M = 10;
  const FLAG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M8 4h11l-3 4 3 4H8z" fill="#e8472a"/></svg>';
  const MINE = '<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="#222" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/></g><circle cx="12" cy="12" r="6.5" fill="#222"/><circle cx="10" cy="10" r="1.8" fill="#fff"/></svg>';
  const wrap = el('div', 'board-wrap'), grid = el('div', 'mines'), row = el('div', 'mrow'), info = el('div', 'info');
  const flagBtn = el('button', 'btn', 'Fahnenmodus'); flagBtn.type = 'button'; flagBtn.setAttribute('aria-pressed', 'false');
  row.append(flagBtn, info); wrap.append(grid); stage.append(wrap, row);
  const ov = overlay(wrap);
  let mine, adj, rev, flg, first, over, flagMode = false, sec, tick, cells, suppress = false;
  function reset(){
    clearInterval(tick); tick = null; sec = 0; first = true; over = false;
    mine = Array(R * C).fill(false); adj = Array(R * C).fill(0); rev = Array(R * C).fill(false); flg = Array(R * C).fill(false);
    grid.innerHTML = ''; cells = [];
    for (let i = 0; i < R * C; i++) {
      const b = el('button', 'mc'); b.type = 'button'; b.setAttribute('aria-label', 'Feld ' + (i + 1));
      let lp = null;
      b.addEventListener('pointerdown', () => { lp = setTimeout(() => { suppress = true; toggleFlag(i); }, 450); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(lp)));
      b.addEventListener('click', () => { if (suppress) { suppress = false; return; } flagMode ? toggleFlag(i) : reveal(i); });
      b.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(i); });
      grid.append(b); cells.push(b);
    }
    api.set(0); updInfo();
  }
  function nb(i){
    const r = Math.floor(i / C), c = i % C, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.push(rr * C + cc);
    }
    return out;
  }
  function place(safe){
    let n = 0;
    while (n < M) { const i = rnd(R * C); if (!mine[i] && i !== safe && !nb(safe).includes(i)) { mine[i] = true; n++; } }
    for (let i = 0; i < R * C; i++) adj[i] = nb(i).filter(j => mine[j]).length;
  }
  function updInfo(){ info.textContent = 'Minen übrig: ' + (M - flg.filter(Boolean).length); }
  function toggleFlag(i){
    if (over || rev[i]) return;
    flg[i] = !flg[i]; cells[i].innerHTML = flg[i] ? FLAG : ''; updInfo();
  }
  function show(i){
    rev[i] = true; const b = cells[i]; b.classList.add('open'); b.innerHTML = '';
    if (adj[i]) { b.textContent = adj[i]; b.dataset.n = adj[i]; }
  }
  function reveal(i){
    if (over || rev[i] || flg[i]) return;
    if (first) {
      first = false; place(i);
      tick = setInterval(() => { sec++; api.set(sec); }, 1000);
    }
    if (mine[i]) { lose(i); return; }
    const stack = [i];
    while (stack.length) {
      const k = stack.pop();
      if (rev[k] || flg[k]) continue;
      show(k);
      if (!adj[k]) nb(k).forEach(j => { if (!rev[j]) stack.push(j); });
    }
    if (rev.filter(Boolean).length === R * C - M) win();
  }
  function lose(i){
    over = true; clearInterval(tick);
    mine.forEach((m, k) => { if (m) { cells[k].classList.add('open'); cells[k].innerHTML = MINE; } });
    cells[i].classList.add('boom');
    setTimeout(() => ov.show('Boom', 'Du hast eine Mine erwischt.', 'Nochmal', reset), 600);
  }
  function win(){
    over = true; clearInterval(tick); api.finish(sec);
    setTimeout(() => ov.show('Geschafft', 'Alle Minen umgangen in ' + sec + ' Sekunden.', 'Nochmal', reset), 400);
  }
  flagBtn.addEventListener('click', () => { flagMode = !flagMode; flagBtn.setAttribute('aria-pressed', String(flagMode)); });
  api.onRestart(() => { ov.hide(); reset(); });
  reset();
  return () => clearInterval(tick);
}

/* ---------- Drei gewinnt ---------- */
function ttt(stage, api){
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const seg = el('div', 'seg'), grid = el('div', 'ttt'), status = el('div', 'info'), nextBtn = el('button', 'btn primary', 'Nächste Runde');
  const bEasy = el('button', 'chip', 'Leicht'), bHard = el('button', 'chip', 'Unschlagbar');
  [bEasy, bHard].forEach(b => b.type = 'button'); nextBtn.type = 'button';
  status.setAttribute('role', 'status'); seg.append(bEasy, bHard);
  stage.append(seg, grid, status, nextBtn);
  let b, over, hard = false, streak = 0, aiFirst = false, line = [], timers = [], gone = false;
  function later(fn, ms){ timers.push(setTimeout(() => { if (!gone) fn(); }, ms)); }
  function result(bd){
    for (const [x, y, z] of LINES) if (bd[x] && bd[x] === bd[y] && bd[x] === bd[z]) return {w: bd[x], line: [x, y, z]};
    return bd.every(Boolean) ? {w: 'draw', line: []} : null;
  }
  function mm(bd, turn, d){
    const r = result(bd);
    if (r) return r.w === 'O' ? 10 - d : r.w === 'X' ? d - 10 : 0;
    let best = turn === 'O' ? -99 : 99;
    for (let i = 0; i < 9; i++) if (!bd[i]) {
      bd[i] = turn; const s = mm(bd, turn === 'O' ? 'X' : 'O', d + 1); bd[i] = '';
      best = turn === 'O' ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
  function aiPick(){
    const e = []; b.forEach((v, i) => { if (!v) e.push(i); });
    if (!hard && Math.random() < .55) return e[rnd(e.length)];
    let bs = -99, bm = [];
    for (const i of e) { b[i] = 'O'; const s = mm(b, 'X', 1); b[i] = ''; if (s > bs) { bs = s; bm = [i]; } else if (s === bs) bm.push(i); }
    return bm[rnd(bm.length)];
  }
  function render(){
    grid.innerHTML = '';
    b.forEach((v, i) => {
      const c = el('button', 'tc' + (line.includes(i) ? ' win' : ''), v); c.type = 'button'; c.dataset.v = v;
      c.setAttribute('aria-label', 'Feld ' + (i + 1) + (v ? ', ' + v : ', leer'));
      c.disabled = over || !!v;
      c.addEventListener('click', () => play(i));
      grid.append(c);
    });
    bEasy.setAttribute('aria-pressed', String(!hard)); bHard.setAttribute('aria-pressed', String(hard));
  }
  function end(){
    const r = result(b); if (!r) return false;
    over = true; line = r.line;
    if (r.w === 'X') { streak++; api.set(streak); api.finish(streak); status.textContent = 'Gewonnen. Serie: ' + streak; }
    else if (r.w === 'O') { streak = 0; api.set(0); status.textContent = 'Verloren. Die Serie beginnt von vorn.'; }
    else status.textContent = 'Unentschieden.';
    nextBtn.hidden = false; render(); return true;
  }
  function play(i){
    if (over || b[i] || turn !== 'X') return;
    b[i] = 'X'; render();
    if (end()) return;
    turn = 'O'; status.textContent = 'Computer denkt …'; later(ai, 420);
  }
  function ai(){
    b[aiPick()] = 'O'; turn = 'X'; render();
    if (!end()) status.textContent = 'Du bist dran. Du spielst X.';
  }
  let turn = 'X';
  function round(){
    b = Array(9).fill(''); over = false; line = []; nextBtn.hidden = true;
    if (aiFirst) { turn = 'O'; status.textContent = 'Computer beginnt …'; render(); later(ai, 450); }
    else { turn = 'X'; status.textContent = 'Du bist dran. Du spielst X.'; render(); }
    aiFirst = !aiFirst;
  }
  function setLevel(h){ hard = h; streak = 0; api.set(0); timers.forEach(clearTimeout); aiFirst = false; round(); }
  bEasy.addEventListener('click', () => setLevel(false));
  bHard.addEventListener('click', () => setLevel(true));
  nextBtn.addEventListener('click', round);
  api.onRestart(() => { streak = 0; api.set(0); timers.forEach(clearTimeout); aiFirst = false; round(); });
  round();
  return () => { gone = true; timers.forEach(clearTimeout); };
}

];
const CATS = ['Alle', 'Arcade', 'Knobeln'];

/* ---------- Portal ---------- */
const grid = $('#grid'), chips = $('#chips'), q = $('#q'), game = $('#game');
let cat = 'Alle';
$('#count').textContent = GAMES.length;

function best(g){ return store.get('best:' + g.id, null); }
function renderChips(){
  chips.innerHTML = '';
  CATS.forEach(c => {
    const b = el('button', 'chip', c); b.type = 'button'; b.setAttribute('aria-pressed', String(c === cat));
    b.addEventListener('click', () => { cat = c; renderChips(); renderGrid(); });
    chips.append(b);
  });
}
function renderGrid(){
  const term = q.value.trim().toLowerCase();
  const list = GAMES.filter(g => (cat === 'Alle' || g.cat === cat) && (!term || (g.title + ' ' + g.desc + ' ' + g.cat).toLowerCase().includes(term)));
  grid.innerHTML = '';
  if (!list.length) { grid.append(el('div', 'empty', 'Kein Spiel gefunden. Versuche einen anderen Suchbegriff.')); return; }
  const featured = cat === 'Alle' && !term;
  list.forEach((g, i) => {
    const b = best(g);
    const a = el('a', 'tile' + (featured && i === 0 ? ' feat' : ''),
      '<div class="thumb">' + g.thumb + '</div><div class="tbody"><div class="trow"><h3>' + g.title + '</h3><span class="tag">' + g.cat + '</span></div><p>' + g.desc + '</p>' +
      '<div class="rec' + (b == null ? ' none' : '') + '">' + (b == null ? 'Noch kein Rekord' : 'Rekord ' + b + ' ' + g.unit) + '</div></div>');
    a.href = '#' + g.id; a.style.setProperty('--c1', g.c1); a.style.setProperty('--c2', g.c2);
    grid.append(a);
  });
}
q.addEventListener('input', renderGrid);

/* ---------- Spielansicht ---------- */
const stage = $('#stage'), sc = $('#sc'), bs = $('#bs');
let current = null, restartFn = null, lastId = null;

function openGame(g){
  closeGame(true);
  lastId = g.id;
  $('#gtitle').textContent = g.title; $('#klabel').textContent = g.label; $('#ghint').textContent = g.hint;
  const b = best(g); bs.textContent = b == null ? '–' : b; sc.textContent = '0';
  game.hidden = false; document.body.classList.add('noscroll'); game.scrollTop = 0;
  const api = {
    set(n){ sc.textContent = n; },
    finish(n){
      const old = best(g);
      const ok = g.better === 'high' ? n > 0 && (old == null || n > old) : (old == null || n < old);
      if (ok) { store.set('best:' + g.id, n); bs.textContent = n; }
    },
    onRestart(fn){ restartFn = fn; }
  };
  current = g.mount(stage, api);
  $('#gtitle').focus({preventScroll:true});
}
function closeGame(keepView){
  if (typeof current === 'function') current();
  current = null; restartFn = null; stage.innerHTML = '';
  if (!keepView) {
    game.hidden = true; document.body.classList.remove('noscroll'); renderGrid();
    if (lastId) { const t = grid.querySelector('a[href="#' + lastId + '"]'); if (t) t.focus({preventScroll:true}); }
  }
}
$('#restart').addEventListener('click', () => { if (restartFn) restartFn(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !game.hidden) location.hash = ''; });

function route(){
  const id = location.hash.slice(1), g = GAMES.find(x => x.id === id);
  if (g) openGame(g); else if (!game.hidden) closeGame(false);
}
addEventListener('hashchange', route);

renderChips(); renderGrid(); route();
})();
</script>
